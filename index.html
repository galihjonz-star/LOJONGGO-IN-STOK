<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#b30f12"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><title>Form Penerimaan Barang - Lojonggo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f2;--card:#fff;--tx:#1a1a1a;--mu:#6b6b6b;--red:#b30f12;--gold:#c9a227;--bd:#ddd5c6}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161412;--card:#221f1c;--tx:#f3eee6;--mu:#a59f94;--bd:#3a352f}}
:root[data-theme=dark]{--bg:#161412;--card:#221f1c;--tx:#f3eee6;--mu:#a59f94;--bd:#3a352f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
header{background:var(--red);color:#fff;padding:12px 14px;border-bottom:4px solid var(--gold)}header b{font-size:17px}header div{font-size:12px;opacity:.9}
main{max-width:1100px;margin:auto;padding:10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px}
input,button,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px}
button{cursor:pointer}.p{background:var(--red);color:#fff;border:0;font-weight:600}.g{background:#25a244;color:#fff;border:0;font-weight:600}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.f label{display:flex;flex-direction:column;font-size:12px;gap:2px;color:var(--mu)}.f input{color:var(--tx)}
.w{overflow-x:auto;max-height:70vh}table{border-collapse:collapse;width:100%;min-width:760px}th{background:var(--red);color:#fff;padding:6px;position:sticky;top:0;z-index:1;font-size:12px}
td{border-bottom:1px solid var(--bd);padding:2px 4px}td input{width:100%;min-width:62px;padding:5px}td.n{white-space:nowrap}tr.on{background:#c9a22722}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.sum div{border:1px solid var(--gold);border-radius:8px;padding:8px}.sum b{display:block;font-size:17px;color:var(--red)}
.bar{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding:8px 0}.bad{color:var(--red);font-weight:700}
#pr{display:none}@media print{@page{size:A4 landscape;margin:8mm}body>*{display:none!important}#pr{display:block!important;color:#000;background:#fff;font-size:8px}#pr th{background:#b30f12!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}#pr td,#pr th{border:1px solid #888;padding:1px 3px}#pr table{min-width:0}}
</style></head><body>
